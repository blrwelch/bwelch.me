<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Add Brittany Welch as a Contact</title>
<meta name="description" content="Save Brittany Welch's contact card to your phone." />
<meta name="robots" content="noindex" />
<script>
  // iOS handles vCards natively (native "Add Contact" sheet), so send it straight
  // to the .vcf before anything else renders. Everyone else sees the page below.
  (function() {
    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      window.location.replace('brittany-welch.vcf');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260902c">
<link rel="stylesheet" href="add-me.css">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      if (saved && ['dark','dark-hc','light','light-hc'].indexOf(saved) >= 0) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia) {
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        var hc = window.matchMedia('(prefers-contrast: more)').matches;
        document.documentElement.setAttribute('data-theme', (light ? 'light' : 'dark') + (hc ? '-hc' : ''));
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch(e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
</head>
<body>

<main class="add-me">
  <div class="container add-me__container">
    <a href="index.html" class="logo add-me__logo">b<span>.</span>welch</a>

    <div class="add-me__card">
      <div class="add-me__avatar">
        <img src="images/avatar.jpg" alt="Portrait of Brittany Welch" onerror="this.style.display='none'" />
      </div>
      <h1 class="add-me__name">Brittany Welch</h1>
      <p class="add-me__title">Web Designer + Consultant</p>

      <div class="add-me__details">
        <a href="tel:+16625500523" class="add-me__detail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          (662) 550-0523
        </a>
        <a href="mailto:britt@bwelch.me" class="add-me__detail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          britt@bwelch.me
        </a>
      </div>

      <a href="brittany-welch.vcf?direct=1" class="btn btn-primary add-me__cta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
        Add to Contacts
      </a>

      <p class="add-me__hint" id="platformHint">
        Tap the button, then open the downloaded file to save it as a contact.
      </p>
    </div>
  </div>
</main>

<script>
  (function() {
    var hint = document.getElementById('platformHint');
    if (!hint) return;
    var isAndroid = /Android/.test(navigator.userAgent);
    if (!isAndroid) {
      hint.textContent = "Download my contact card to import it into your address book.";
    }
  })();
</script>

</body>
</html>
